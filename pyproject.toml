[project]
name = "textbook-mcp"
version = "0.1.0"
description = "Deterministic local MCP server for OpenStax Chemistry 2e"
readme = "spec.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "lxml>=5.3.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
textbook-mcp = "textbook_mcp.server:main"
textbook-ingest = "textbook_mcp.ingest:main"
textbook-harness = "textbook_mcp.harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textbook_mcp"]
